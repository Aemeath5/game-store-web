services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: game-market-web:local
    container_name: game-market-web
    restart: unless-stopped
    ports:
      - "9090:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
