name: Frontend build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Extract and validate game icons
        run: |
          cat public/game-assets/icons.tar.gz.part-* | tar -xzf - -C public/game-assets
          rm public/game-assets/icons.tar.gz.part-*
          npm run validate:game-assets

      - name: Type-check and build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-market-web-dist
          path: dist/
          if-no-files-found: error
